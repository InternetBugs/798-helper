name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner ships the SDK at $ANDROID_HOME; android-actions/setup-android@v3
      # is broken (it still tries to install the removed "tools" package).
      - name: Ensure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ ! -x "$SDK/build-tools/35.0.0/aapt2" ]; then
            SDKM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Fetch libxposed api
        run: |
          mkdir -p tools
          curl -fsSL -o /tmp/api.aar \
            https://repo1.maven.org/maven2/io/github/libxposed/api/102.0.0/api-102.0.0.aar
          unzip -p /tmp/api.aar classes.jar > tools/api-102.jar

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}"
          fi
          IFS=. read -r major minor patch <<< "$name"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          patch=${patch%%[!0-9]*}
          code=$(( major * 10000 + minor * 100 + patch ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE=/tmp/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set, the APK will be signed with a throwaway key"
          fi

      - name: Build
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: 798-helper-${{ steps.version.outputs.name }}
          path: build/798-helper.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/798-helper.apk
          generate_release_notes: true
          body: |
            下载 `798-helper.apk`，安装后在 LSPosed 里启用，作用域勾选「慧生活798」。
            模块没有桌面图标，装完在桌面找不到是正常的。
